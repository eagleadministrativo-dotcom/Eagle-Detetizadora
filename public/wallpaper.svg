<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="diagonal-stripes" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#f3f3f3" stroke-width="20" opacity="0.03"/>
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafaf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>
  <rect width="1920" height="1080" fill="url(#diagonal-stripes)"/>

  <!-- Geometric shapes -->
  <!-- Large circle top-right -->
  <circle cx="1600" cy="-200" r="800" fill="#000" opacity="0.03"/>

  <!-- Yellow accent diagonal -->
  <polygon points="0,500 400,300 500,350 100,550" fill="#FFD700" opacity="0.08"/>

  <!-- Black accent squares -->
  <rect x="100" y="100" width="150" height="150" fill="#000" opacity="0.04" transform="rotate(15 175 175)"/>
  <rect x="1700" y="800" width="200" height="200" fill="#000" opacity="0.03" transform="rotate(-30 1800 900)"/>

  <!-- White circles pattern -->
  <circle cx="400" cy="800" r="100" fill="#fff" opacity="0.08"/>
  <circle cx="1200" cy="250" r="80" fill="#fff" opacity="0.06"/>
  <circle cx="1800" cy="500" r="120" fill="#fff" opacity="0.05"/>

  <!-- Yellow accent lines -->
  <line x1="200" y1="0" x2="400" y2="1080" stroke="#FFD700" stroke-width="2" opacity="0.05"/>
  <line x1="1600" y1="0" x2="1800" y2="1080" stroke="#FFD700" stroke-width="2" opacity="0.04"/>

  <!-- Bottom-left geometric -->
  <polygon points="0,1080 300,900 250,1080" fill="#000" opacity="0.05"/>

  <!-- Top-right corner -->
  <rect x="1800" y="0" width="120" height="120" fill="#FFD700" opacity="0.06"/>
</svg>