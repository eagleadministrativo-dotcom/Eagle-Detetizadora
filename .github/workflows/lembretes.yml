name: Lembretes e notificações
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rotina de lembretes
        run: curl -fsS --max-time 50 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://marfim-studio-os-tan.vercel.app
