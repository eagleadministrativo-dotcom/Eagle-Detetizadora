name: CI

# Roda a cada envio para a main e em pull requests: segredos, tipos, lint, testes, build e ponta a ponta.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Varredura de segredos
        run: npm run check:secrets
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npx eslint src --quiet
      - name: Testes unitários e de integração
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Ponta a ponta (celular e computador, claro e escuro)
        run: npm run e2e
      - name: Relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
